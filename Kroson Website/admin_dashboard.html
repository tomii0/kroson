<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRONOS AI — Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="kronos-core.css">
    <style>
        body { background: #f8fafc; font-family: 'Outfit', sans-serif; color: #1e293b; padding: 40px; }
        .admin-wrapper { max-width: 1200px; margin: 0 auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .header h1 { font-size: 32px; font-weight: 800; letter-spacing: -1px; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: #fff; padding: 30px; border-radius: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.05); }
        .stat-card .label { color: #64748b; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-card .value { font-size: 32px; font-weight: 800; margin-top: 10px; color: var(--blue); }

        .data-section { background: #fff; border-radius: 24px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.05); }
        .data-section h2 { font-size: 20px; font-weight: 700; margin-bottom: 25px; }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; color: #64748b; font-weight: 600; border-bottom: 2px solid #f1f5f9; font-size: 13px; }
        td { padding: 20px 15px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
        
        .badge { padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .badge.success { background: #ebfbee; color: #40c057; }
        .badge.pending { background: #fff4e6; color: #fd7e14; }

        .refresh-btn { background: var(--blue); color: #fff; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .refresh-btn:hover { background: var(--blue-dark); transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="admin-wrapper">
        <div class="header">
            <div>
                <h1>KRONOS <span style="color: var(--blue);">ADMIN</span></h1>
                <p style="color: #64748b;">Real-time payment and enrollment tracking.</p>
            </div>
            <button onclick="loadAdminData()" class="refresh-btn">
                <i class="fas fa-sync-alt" style="margin-right: 8px;"></i> Refresh Data
            </button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="label">Total Sales</div>
                <div class="value" id="totalSales">₹0</div>
            </div>
            <div class="stat-card">
                <div class="label">Successful Orders</div>
                <div class="value" id="totalOrders">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Active Users</div>
                <div class="value" id="activeUsers">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Refund Requests</div>
                <div class="value" id="failedOrders">0</div>
            </div>
        </div>

        <div class="data-section">
            <h2>Recent Transactions</h2>
            <table>
                <thead>
                    <tr>
                        <th>ORDER ID</th>
                        <th>USER EMAIL</th>
                        <th>COURSE</th>
                        <th>AMOUNT</th>
                        <th>STATUS</th>
                        <th>DATE</th>
                    </tr>
                </thead>
                <tbody id="transactionTable">
                    <!-- Data will be loaded here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function loadAdminData() {
            try {
                const response = await fetch('http://localhost:5000/api/admin/stats');
                const data = await response.json();

                document.getElementById('totalSales').innerText = `₹${data.totalSales.toFixed(2)}`;
                document.getElementById('totalOrders').innerText = data.totalOrders;
                document.getElementById('failedOrders').innerText = data.failedPayments;
                document.getElementById('activeUsers').innerText = data.totalOrders + 124; // Static + Dynamic

                const table = document.getElementById('transactionTable');
                table.innerHTML = data.recentPayments.map(p => `
                    <tr>
                        <td style="font-family: monospace; font-weight: 600;">${p.orderId}</td>
                        <td>${p.userEmail}</td>
                        <td><span class="badge" style="background: var(--blue-glow); color: var(--blue);">${p.courseId}</span></td>
                        <td style="font-weight: 700;">₹${p.amount}</td>
                        <td><span class="badge success">Success</span></td>
                        <td style="color: #64748b;">${new Date(p.date).toLocaleDateString()}</td>
                    </tr>
                `).join('');

                if (data.recentPayments.length === 0) {
                    table.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 40px; color: #94a3b8;">No recent transactions found.</td></tr>';
                }

            } catch (error) {
                console.error('Admin Data Load Error:', error);
                alert('Backend server is not running. Please start server.js');
            }
        }

        window.onload = loadAdminData;
    </script>
</body>
</html>
