<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports — KRONOS AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="kronos-core.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        body { font-family: 'Outfit', sans-serif; background: #f8faff; color: #111; margin: 0; min-height: 100vh; overflow-x: hidden; }
        
        /* Premium Background */
        .bg-glow {
            position: fixed;
            top: -10%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(99, 132, 255, 0.15) 0%, transparent 70%);
            z-index: -1;
            filter: blur(60px);
        }

        /* Glass Nav */
        header.topbar {
            position: sticky;
            top: 0;
            left: 0;
            width: 100%;
            display: grid;
            grid-template-columns: 240px 1fr 240px;
            align-items: center;
            padding: 20px 40px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            z-index: 1000;
            box-sizing: border-box;
        }

        header.topbar .logo { font-weight: 800; font-size: 22px; text-decoration: none; color: #111; letter-spacing: -1px; }
        header.topbar nav { display: flex; gap: 30px; justify-content: center; }
        header.topbar nav a { text-decoration: none; color: var(--text-gray); font-size: 14.5px; font-weight: 500; transition: color 0.3s; }
        header.topbar nav a:hover, header.topbar nav a.active { color: var(--primary-blue); }

        .reports-wrapper { max-width: 1200px; margin: 60px auto; padding: 0 30px; }
        
        .header-section {
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            margin-bottom: 50px;
        }

        .header-section h1 { font-size: 36px; font-weight: 800; letter-spacing: -1.5px; margin: 0; }

        .btn-generate {
            background: linear-gradient(135deg, var(--primary-blue), var(--blue-dark));
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(99, 132, 255, 0.3);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-generate:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 15px 35px rgba(99, 132, 255, 0.4); }
        .btn-generate:active { transform: translateY(0); }
        .btn-generate.loading { opacity: 0.8; pointer-events: none; }

        .report-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 25px; 
        }

        .report-card { 
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 24px; 
            padding: 30px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.03); 
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative;
            overflow: hidden;
        }

        .report-card:hover { 
            transform: translateY(-10px); 
            background: #fff;
            box-shadow: 0 20px 50px rgba(99, 132, 255, 0.12);
            border-color: var(--primary-blue);
        }

        .icon-box { 
            width: 50px; height: 50px; border-radius: 16px; 
            display: flex; align-items: center; justify-content: center; 
            margin-bottom: 25px; font-size: 22px; 
            transition: all 0.3s ease;
        }

        .report-card:hover .icon-box { transform: scale(1.1) rotate(5deg); }

        .date { font-size: 13px; font-weight: 600; color: #a0aec0; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .title { font-weight: 700; font-size: 18px; line-height: 1.4; color: var(--text-dark); margin-bottom: 25px; }
        
        .btn-view { 
            display: block; text-align: center; padding: 12px; 
            background: #f1f5f9; border-radius: 12px; 
            color: #475569; text-decoration: none; 
            font-size: 14px; font-weight: 700; 
            transition: all 0.3s ease; 
            border: 1px solid transparent;
        }

        .report-card:hover .btn-view { 
            background: var(--primary-blue); 
            color: white; 
            box-shadow: 0 5px 15px rgba(99, 132, 255, 0.3);
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.4);
            backdrop-filter: blur(8px); display: flex; align-items: center;
            justify-content: center; z-index: 2000; opacity: 0; visibility: hidden;
            transition: all 0.4s ease;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content {
            background: #fff; width: 90%; max-width: 600px;
            border-radius: 30px; padding: 45px 40px 40px; position: relative;
            transform: translateY(30px); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .btn-close { position: absolute; top: 18px; right: 18px; background: #f1f5f9; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; transition: background 0.2s; }
        .btn-close:hover { background: #e2e8f0; }

        /* Toast Styles */
        #toastContainer { position: fixed; bottom: 30px; right: 30px; z-index: 3000; display: flex; flex-direction: column; gap: 10px; }
        .toast { 
            background: #fff; color: #111; padding: 16px 24px; border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 12px;
            transform: translateX(120%); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-left: 4px solid var(--primary-blue); font-weight: 600; font-size: 14px;
        }
        .toast.show { transform: translateX(0); }
        .toast.success { border-left-color: #40c057; }
        .toast.info { border-left-color: var(--primary-blue); }
        .toast i { font-size: 18px; }

        /* New Styles for Create/Delete */
        .btn-delete {
            position: absolute; top: 15px; right: 15px; 
            background: rgba(239, 68, 68, 0.05); color: #ef4444; 
            border: none; width: 32px; height: 32px; border-radius: 8px; 
            cursor: pointer; opacity: 0; transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center;
        }
        .report-card:hover .btn-delete { opacity: 1; }
        .btn-delete:hover { background: #ef4444; color: white; transform: scale(1.1); }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: #4a5568; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 12px 15px; border-radius: 12px;
            border: 1px solid #e2e8f0; background: #f8fafc;
            font-family: inherit; font-size: 14px; transition: all 0.3s;
            box-sizing: border-box;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            border-color: var(--primary-blue); outline: none; background: #fff;
            box-shadow: 0 0 0 4px rgba(99, 132, 255, 0.1);
        }

        .badge {
            background: rgba(99, 132, 255, 0.1); color: var(--primary-blue);
            padding: 4px 12px; border-radius: 20px; font-size: 11px;
            font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
        }

        .modal-footer { display: flex; gap: 15px; margin-top: 30px; }
        .btn-cancel { 
            background: #f1f5f9; color: #475569; border: none; 
            padding: 12px 24px; border-radius: 12px; font-weight: 600; 
            cursor: pointer; transition: 0.3s; flex: 1;
        }
        .btn-cancel:hover { background: #e2e8f0; }

        /* Animation for deletion */
        .fade-out { opacity: 0; transform: scale(0.9); transition: all 0.4s ease; }
    </style>
</head>
<body>
    <div class="bg-glow"></div>

    <header class="topbar">
        <div class="logo-wrapper">
            <a href="start_page.html" class="logo">KRONOS</a>
        </div>
        <nav class="nav-links">
            <a href="start_page.html">Home</a>
            <a href="apps.html">Apps</a>
            <a href="courses.html">Courses</a>
            <a href="about.html">About Us</a>
        </nav>
        <div class="nav-right">
            <div class="nav-actions" id="nav-auth-container"></div>
            <a href="start_page.html" class="btn-back">← Back</a>
        </div>
    </header>

    <style>
        /* Updated Navbar Alignment */
        header.topbar {
            display: flex !important;
            justify-content: space-between !important;
            grid-template-columns: none !important; /* Remove old grid */
            padding: 15px 60px !important;
        }

        .logo-wrapper {
            flex: 1;
            display: flex;
            justify-content: flex-start;
        }

        header.topbar .nav-links {
            flex: 2;
            display: flex;
            justify-content: center;
            gap: 40px;
        }

        .nav-right {
            flex: 1;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 20px;
        }

        .btn-back {
            background: #111;
            color: #fff;
            border: none;
            border-radius: 40px;
            padding: 10px 24px;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            transition: 0.3s;
        }

        .btn-back:hover {
            background: #333;
            transform: translateY(-2px);
        }
    </style>

    <div class="reports-wrapper">
        <div class="header-section">
            <div>
                <h1>Reports</h1>
                <p style="color: #64748b; margin: 8px 0 0; font-weight: 500;">Manage and generate your AI-powered analytics.</p>
            </div>
            <button id="generateReportBtn" class="btn-generate">
                <i class="fas fa-plus"></i> Generate New Report
            </button>
        </div>

        <div id="reportGrid" class="report-grid">
            <!-- Dynamic Reports Inject Here -->
        </div>
    </div>

    <!-- CREATE REPORT MODAL -->
    <div class="modal-overlay" id="createReportModal">
        <div class="modal-content">
            <button class="btn-close"><i class="fas fa-times"></i></button>
            <h2 style="font-size: 24px; font-weight: 800; margin-bottom: 25px;">Create New Report</h2>
            <form id="reportForm">
                <div class="form-group">
                    <label>Report Title</label>
                    <input type="text" id="reportTitle" placeholder="e.g. Q2 Performance Audit" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="reportCategory">
                        <option value="Apps">Apps</option>
                        <option value="Bugs">Bugs</option>
                        <option value="Account Issues">Account Issues</option>
                        <option value="Feedback">Feedback</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Content / Description</label>
                    <textarea id="reportContent" rows="5" placeholder="Enter report details here..." required></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancel">Cancel</button>
                    <button type="submit" class="btn-generate">Submit Report</button>
                </div>
            </form>
        </div>
    </div>

    <!-- VIEW REPORT MODAL -->
    <div class="modal-overlay" id="reportModal">
        <div class="modal-content">
            <button class="btn-close" id="closeModal"><i class="fas fa-times"></i></button>
            <div id="modalContent"></div>
        </div>
    </div>

    <!-- CONFIRM DELETE MODAL -->
    <div class="modal-overlay" id="confirmDeleteModal">
        <div class="modal-content" style="max-width: 400px; text-align: center;">
            <div style="width: 60px; height: 60px; background: rgba(239, 68, 68, 0.1); color: #ef4444; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 24px;">
                <i class="fas fa-trash-alt"></i>
            </div>
            <h2 style="margin: 0 0 10px; font-size: 20px;">Delete Report?</h2>
            <p style="color: #64748b; font-size: 14px; margin-bottom: 25px;">This action cannot be undone. Are you sure you want to remove this report?</p>
            <div class="modal-footer">
                <button class="btn-cancel">No, Keep it</button>
                <button id="confirmDeleteBtn" style="background: #ef4444; color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 600; cursor: pointer; flex: 1;">Yes, Delete</button>
            </div>
        </div>
    </div>

    <script src="kronos-core.js"></script>
    <script src="reports.js"></script>
</body>
</html>
