<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings — KRONOS AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="kronos-core.css">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #f4f6fb; color: #111; margin: 0; min-height: 100vh; opacity: 0; transition: opacity 0.4s ease; }
        body.loaded { opacity: 1; }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 60px; background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0,0,0,0.05); sticky: top; z-index: 100; }
        .logo { font-weight: 800; font-size: 22px; letter-spacing: -1px; }
        .settings-wrapper { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .settings-section { background: white; border-radius: 24px; padding: 30px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.03); }
        .settings-section h2 { font-size: 20px; margin-bottom: 25px; border-bottom: 1px solid #f0f0f0; padding-bottom: 15px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; color: #555; }
        input[type="text"], input[type="email"], select { width: 100%; padding: 12px 16px; border-radius: 12px; border: 1.5px solid #eee; font-family: inherit; font-size: 14px; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: var(--primary-blue); }
        .toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; }
    </style>
</head>
<body>
    <nav>
        <div class="logo">KRONOS AI</div>
        <div class="nav-links" style="display: flex; gap: 30px;">
            <a href="krosonai.html" style="text-decoration: none; color: #666; font-size: 14px; font-weight: 500;">Home</a>
            <a href="apps.html" style="text-decoration: none; color: #666; font-size: 14px; font-weight: 500;">Apps</a>
            <a href="courses.html" style="text-decoration: none; color: #666; font-size: 14px; font-weight: 500;">Courses</a>
        </div>
        <div class="nav-actions" id="nav-auth-container"></div>
    </nav>

    <div class="settings-wrapper">
        <h1>Settings</h1>
        
        <div class="settings-section">
            <h2>Account Preferences</h2>
            <div class="form-group">
                <label>Language</label>
                <select>
                    <option>English (US)</option>
                    <option>Spanish</option>
                    <option>French</option>
                </select>
            </div>
            <div class="form-group">
                <label>Timezone</label>
                <select>
                    <option>(GMT+05:30) Mumbai, New Delhi</option>
                    <option>(GMT-08:00) Pacific Time</option>
                </select>
            </div>
        </div>

        <div class="settings-section">
            <h2>Security</h2>
            <div class="toggle-row">
                <span>Two-Factor Authentication</span>
                <button style="color: var(--primary-blue); background: none; border: none; font-weight: 600; cursor: pointer;">Enable</button>
            </div>
            <div class="toggle-row" style="border-top: 1px solid #f0f0f0;">
                <span>Session Timeout (minutes)</span>
                <input type="text" value="30" style="width: 60px; text-align: center;">
            </div>
        </div>

        <button style="background: var(--text-dark); color: white; border: none; padding: 16px 40px; border-radius: 40px; font-weight: 600; cursor: pointer; margin-top: 20px;">Save Changes</button>
    </div>

    <script src="kronos-core.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => { document.body.classList.add('loaded'); });
    </script>
</body>
</html>
