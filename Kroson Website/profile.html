<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile — KRONOS AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="kronos-core.css">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #f4f6fb; color: #111; margin: 0; min-height: 100vh; opacity: 0; transition: opacity 0.4s ease; }
        body.loaded { opacity: 1; }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 60px; background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0,0,0,0.05); sticky: top; z-index: 100; }
        .logo { font-weight: 800; font-size: 22px; letter-spacing: -1px; }
        .profile-wrapper { max-width: 800px; margin: 60px auto; padding: 0 20px; }
        .profile-card { background: white; border-radius: 30px; padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.03); display: flex; flex-direction: column; align-items: center; text-align: center; }
        .large-avatar { width: 120px; height: 120px; border-radius: 50%; background: linear-gradient(135deg, #6384ff, #4a6aff); margin-bottom: 24px; display: flex; align-items: center; justify-content: center; font-size: 48px; color: white; font-weight: 700; border: 4px solid white; box-shadow: 0 10px 30px rgba(99,132,255,0.2); overflow: hidden; }
        .large-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-details { width: 100%; margin-top: 30px; text-align: left; }
        .detail-row { display: flex; justify-content: space-between; padding: 18px 0; border-bottom: 1px solid #f0f0f0; }
        .detail-label { color: #888; font-size: 14px; font-weight: 500; }
        .detail-value { font-weight: 600; color: #111; }
        .btn-edit { margin-top: 40px; background: var(--primary-blue); color: white; border: none; padding: 14px 40px; border-radius: 30px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
        .btn-edit:hover { background: var(--blue-dark); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(99,132,255,0.3); }
    </style>
</head>
<body>
    <nav>
        <div class="logo">KRONOS AI</div>
        <div class="nav-links" style="display: flex; gap: 30px;">
            <a href="krosonai.html" style="text-decoration: none; color: #666; font-size: 14px; font-weight: 500;">Home</a>
            <a href="apps.html" style="text-decoration: none; color: #666; font-size: 14px; font-weight: 500;">Apps</a>
            <a href="courses.html" style="text-decoration: none; color: #666; font-size: 14px; font-weight: 500;">Courses</a>
        </div>
        <div class="nav-actions" id="nav-auth-container"></div>
    </nav>

    <div class="profile-wrapper">
        <div class="profile-card">
            <div class="large-avatar" id="profile-avatar-large">?</div>
            <h1 id="profile-name">User Name</h1>
            <p id="profile-email" style="color: #666; margin-top: 5px;">user@example.com</p>

            <div class="profile-details">
                <div class="detail-row">
                    <span class="detail-label">Account Status</span>
                    <span class="detail-value" style="color: #22c55e;">Verified</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Member Since</span>
                    <span class="detail-value">May 2026</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Subscription</span>
                    <span class="detail-value">Free Tier</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Location</span>
                    <span class="detail-value">Not set</span>
                </div>
            </div>

            <button class="btn-edit">Edit Profile</button>
        </div>
    </div>

    <script src="kronos-core.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.body.classList.add('loaded');
            const session = KronosCore.getSession();
            if (session) {
                const name = session.username || 'User';
                document.getElementById('profile-name').textContent = name;
                document.getElementById('profile-email').textContent = session.email;
                
                // Avatar logic
                const avatar = document.getElementById('profile-avatar-large');
                if (session.picture) {
                    avatar.innerHTML = `<img src="${session.picture}" alt="${name}">`;
                } else {
                    avatar.textContent = name.charAt(0).toUpperCase();
                }

                // Register Date logic
                if (session.registerDate) {
                    const date = new Date(session.registerDate);
                    const formatted = date.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
                    const dateEl = document.querySelector('.detail-row:nth-child(2) .detail-value');
                    if (dateEl) dateEl.textContent = formatted;
                }
            }
        });
    </script>
</body>
</html>
